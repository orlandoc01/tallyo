[package]
name = "tallyo"
version = "0.1.0"
edition = "2024"

[lints.rust]
unreachable_pub = "warn"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
# catch_unwind in the GraphQL extension and the MCP server needs unwinding panics.
panic = "unwind"

[dependencies]
anyhow = "1.0.104"
async-graphql = { version = "7.2.1", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
croner = "3.0.1"
csv = "1.3.1"
figment = { version = "0.10.19", features = ["yaml"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4.3"
hyper-util = { version = "0.1.20", features = ["server-auto", "server-graceful", "service", "tokio"] }
ipnet = "2.12.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
libsqlite3-sys = { version = "=0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
p256 = "0.14.0"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rust-embed = { version = "8", features = ["mime-guess"] }
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
strum = "0.27.2"
strum_macros = "0.27.2"
subtle = "2.6.1"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
webauthn-rs-core = "0.5.5"

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
tempfile = "3.23.0"
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
wiremock = "0.6.5"

[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys", "strum"]
